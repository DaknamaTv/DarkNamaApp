name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to create release for (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: |
          chmod +x gradlew

      - name: Make scripts executable
        run: |
          chmod +x scripts/*.sh

      - name: Validate Gradle Wrapper
        run: |
          ./scripts/verify-gradle-wrapper.sh
        continue-on-error: true
        timeout-minutes: 5

      - name: Retry Gradle Wrapper Validation (if needed)
        run: |
          echo "Checking if Gradle wrapper validation is needed..."
          # If the previous step failed, try a manual validation approach
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar.sha256" ]; then
            echo "Gradle wrapper checksum missing, generating new one..."
            ./scripts/fix-gradle-wrapper.sh
          else
            echo "Gradle wrapper checksum already exists, continuing..."
          fi
        continue-on-error: true

      - name: Check Gradle Wrapper Validation Result
        run: |
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar.sha256" ]; then
            echo "Gradle wrapper checksum missing, generating new one..."
            cd gradle/wrapper
            sha256sum gradle-wrapper.jar > gradle-wrapper.jar.sha256
          fi

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: wrapper

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEY_STORE }}" | base64 --decode > app/keystore.jks
        continue-on-error: true

      - name: Create keystore properties file
        run: |
          echo "storePassword=${{ secrets.KEY_STORE_PASSWORD }}" > key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> key.properties
          echo "storeFile=keystore.jks" >> key.properties
        continue-on-error: true

      # NOTE: this step MUST run before "Build APK" so the tag can be
      # injected into the APK as versionName / versionCode.
      - name: Get tag name
        id: get_tag
        run: |
          if [[ $GITHUB_EVENT_NAME == 'workflow_dispatch' ]]; then
            TAG_NAME="${{ github.event.inputs.tag }}"
          else
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          fi
          # strip a leading "v" -> 2.5.0 (used for versionName inside the app)
          APP_VERSION_NAME="${TAG_NAME#v}"
          APP_VERSION_NAME="${APP_VERSION_NAME#V}"
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          echo "APP_VERSION_NAME=$APP_VERSION_NAME" >> $GITHUB_ENV
          echo "Tag name: $TAG_NAME"
          echo "App version name: $APP_VERSION_NAME"

      - name: Build APK
        run: |
          ./gradlew assembleRelease --stacktrace -x lint \
            -PappVersionName="${APP_VERSION_NAME}"

      - name: Rename APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/app-universal-release.apk \
             release/DarkNama-${TAG_NAME}-universal.apk

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Release ${{ env.TAG_NAME }}
          draft: false
          prerelease: false
          files: |
            release/DarkNama-${{ env.TAG_NAME }}-universal.apk
          body: |
            ## DarkNama Release ${{ env.TAG_NAME }}

            **App version:** ${{ env.APP_VERSION_NAME }}

            ### What's New
            - Modernized UI with enhanced user experience
            - Improved performance and stability
            - New features and bug fixes

            ### Download Options
            - [Universal APK (all architectures)](https://github.com/${{ github.repository }}/releases/download/${{ env.TAG_NAME }}/DarkNama-${{ env.TAG_NAME }}-universal.apk) - Compatible with all devices

            ### Installation
            1. Download the appropriate APK file for your device
            2. Enable "Install from unknown sources" in your device settings
            3. Open and install the APK
            4. Launch DarkNama and enjoy your movies!
